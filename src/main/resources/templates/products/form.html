<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${formTitle}">Product</title>
</head>
<body>
<section layout:fragment="content">
    <h2 th:text="${formTitle}">Product</h2>

    <form method="post" enctype="multipart/form-data" th:object="${product}"
          th:action="${product.id == null} ? @{/products/create} : @{/products/edit/{id}(id=${product.id})}">
        
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label"> Tên sản phẩm </label>
            <input type="text" class="form-control" th:field="*{name}">
            <div class="text-danger" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label"> Giá </label>
            <input type="number" step="0.01" class="form-control" th:field="*{price}">
            <div class="text-danger" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label"> Số lượng </label>
            <input type="number" class="form-control" th:field="*{quantity}">
            <div class="text-danger" th:errors="*{quantity}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label"> Mô tả </label>
            <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
        </div>

        
        <div class="mb-3" th:if="${product.images != null and !#strings.isEmpty(product.images)}">
            <label class="form-label"> Hình ảnh hiện tại </label>
            <br>
            <img th:src="@{'/uploads/' + ${product.images}}"
                 alt="Product Image" class="img-thumbnail"
                 style="width: 180px; height: 180px; object-fit: cover;">
        </div>

        
        <div class="mb-3">
            <label class="form-label"> Chọn hình ảnh </label>
            <input type="file" class="form-control" name="image" accept="image/*">
            <div class="form-text">
                Định dạng: JPG, PNG, WEBP. Kích thước tối đa 5MB.
            </div>
        </div>

        <button type="submit" class="btn btn-primary"> Lưu </button>
        <a th:href="@{/products}" class="btn btn-secondary"> Quay lại </a>
    </form>
</section>
</body>
</html>
